<!DOCTYPE html>
<html lang="ru">

<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Конвертер [Заказы → Сборки Китай]</title>
 <link rel="stylesheet" href="style.css">
</head>

<body>
 <div class="container">
  <div class="content">
   <div class="section">
    <div class="section-label">
     <span>Вставьте строку из таблицы "Заказы"</span>
    </div>
    <textarea id="input" rows="4" class="input-area" placeholder="Вставьте строку с данными"></textarea>
   </div>

   <div class="btn-group">
    <button class="btn-primary" onclick="convert()"> Конвертировать </button>
    <button class="btn-secondary" onclick="copyOutput()"> Копировать результат </button>
    <button class="btn-outline" onclick="clearAll()"> Очистить всё </button>
   </div>

   <div class="section">
    <div class="section-label">
     <span>Результат для таблицы "Сборки Китай"</span>
    </div>
    <textarea id="output" rows="6" readonly class="output-area" placeholder="Результат конвертации ..."></textarea>
   </div>
  </div>
 </div>

 <div id="toast"></div>

 <script>
  // Конфигурация маппинга полей для лучшей поддерживаемости
  const FIELD_MAPPING = {
   7: { target: 0, transform: (val) => val.split('(')[0].trim(), desc: 'Акулы' },
   22: { target: 1, transform: (val) => val || '', desc: 'Кит группа' },
   4: { target: 3, transform: (val) => val || '', desc: 'Номер кит ТЗ' },
   7: { target: 5, transform: (val) => (val.match(/\(([^)]+)\)/) || [])[1] || '', desc: 'Клиент' },
   8: { target: 11, transform: (val, allCells) => `${val} - ${allCells[9] || ''}`, desc: 'Маршрут' },
   9: { target: 15, transform: (val) => val || '', desc: 'СВХ' },
   10: { target: 17, transform: (val) => val === "---" ? "без" : "да", desc: 'Довоз' },
   10: { target: 18, transform: (val) => val.split('(')[0].trim(), desc: 'Адрес довоза' },
   24: { target: 20, transform: (val) => val || '', desc: 'Штаб' },
   25: { target: 21, transform: (val) => val || '', desc: 'Количество паллет / коробок' },
   26: { target: 23, transform: (val) => val || '', desc: 'Вес' }, // новый
   11: { target: 24, transform: (val) => val || '', desc: 'LDM по длине' },
   12: { target: 25, transform: (val) => val || '', desc: 'LDM по весу' },
   13: { target: 26, transform: (val) => val || '', desc: 'LDM расчетный в сборке' },
   18: { target: 27, transform: (val) => val || '', desc: 'Общая ставка, USD' },
   18: {
    target: 27,
    transform: (val, allCells) => {
     const totalRate = parseFloat(val) || 0;
     const extraCosts = parseFloat(allCells[16]) || 0;
     return totalRate - extraCosts;
    },
    desc: 'Общая ставка, USD, без овердрафта, курсовой разницы и страховки'
   },
   23: { target: 28, transform: (val) => val || '', desc: 'Своз по Китаю, CNY' },
   16: { target: 29, transform: (val) => val || '', desc: 'Дополнительные расходы' }, // новый
   6: { target: 31, transform: (val) => val || '', desc: 'Профит, USD' },
   27: { target: 32, transform: (val) => val || '', desc: 'Стоимость груза, USD' },
   20: { target: 36, transform: (val) => `${val} до ...`, desc: 'ДАТА ВЫГРУЗКИ!' },
   29: { target: 37, transform: (val) => val || '', desc: 'Комментарий' }
  };

  // Значения по умолчанию для полей, которые не маппятся
  const DEFAULT_VALUES = {
   2: "",                // Номе кит авто
   4: "<добавить>",      // Номер ТЗ Lotus
   6: "",                // Отправитель
   7: "",                // Получатель
   12: "без статуса",    // Диспозиция
   13: "Маньчжурия",     // Склад
   14: "---",            // Дата прибытия на склад в Китае
   16: "",               // Адрес СВХ
   19: "---",            // Довоз отдельный / в той же авто
   22: "",               // Размеры
   // 29: "<добавить>",     // Второе Плечо, USD
   30: "",               // Страхование
   33: "---",            // Дата забора в Китае
   34: "---",            // Дата прибытия на границу
   35: "---"             // Дата заезда авто в Китай
  };

  function convert() {
   const input = document.getElementById("input").value.trim();

   if (!input) {
    showToast("❌ Пожалуйста, вставьте данные для конвертации", true);
    return;
   }

   const cells = input.split("\t");

   if (cells.length < 29) {
    showToast(`⚠️ Обнаружено ${cells.length} полей. Ожидается минимум 29. Проверьте формат данных.`, true);
   }

   // Инициализация выходного массива
   const outputCells = new Array(43).fill("");
   // Заполнение значений по умолчанию
   for (const [index, defaultValue] of Object.entries(DEFAULT_VALUES)) {
    outputCells[parseInt(index)] = defaultValue;
   }

   // Применение маппинга полей
   for (const [sourceIndex, mapping] of Object.entries(FIELD_MAPPING)) {
    const sourceValue = cells[parseInt(sourceIndex)] || "";
    const transformedValue = mapping.transform(sourceValue, cells);
    if (transformedValue && outputCells[mapping.target] === "") {
     outputCells[mapping.target] = transformedValue;
    } else if (transformedValue) {
     const defaultValue = DEFAULT_VALUES[mapping.target];
     if (outputCells[mapping.target] === defaultValue) {
      outputCells[mapping.target] = transformedValue;
     }
    }
   }

   // Обработка специальных полей
   outputCells[0] = outputCells[0] || (cells[7]?.split('(')[0].trim() || "");
   outputCells[5] = outputCells[5] || (cells[7]?.match(/\(([^)]+)\)/)?.[1] || "");

   // Формирование результата
   const result = outputCells.join("\t");
   document.getElementById("output").value = result;

   showToast("✅ Конвертация выполнена успешно!");
  }

  function showToast(message, isError = false) {
   const toast = document.getElementById("toast");
   toast.textContent = message;
   toast.className = isError ? "error" : "";
   toast.classList.add("show");

   setTimeout(() => {
    toast.classList.remove("show");
   }, 2000);
  }

  async function copyOutput() {
   const output = document.getElementById("output").value;

   if (!output) {
    showToast("❌ Нет данных для копирования. Сначала выполните конвертацию.", true);
    return;
   }

   try {
    await navigator.clipboard.writeText(output);
    showToast("✅ Результат скопирован в буфер обмена!");
   } catch (err) {
    showToast("❌ Не удалось скопировать результат", true);
   }
  }

  function clearAll() {
   document.getElementById("input").value = "";
   document.getElementById("output").value = "";
   showToast("✅ Поля очищены");
  }
 </script>
</body>

</html>
